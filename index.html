<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>codesport.jp — slot gacor hari ini</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: 'DM Sans', sans-serif;
            color: #ffffff;
            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(212, 175, 55, 0.12),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(212, 175, 55, 0.08),
                    transparent 30%
                ),
                #080808;

            overflow-x: hidden;
        }

        /* =========================
           BACKGROUND EFFECT
        ========================= */

        body::before {
            content: "";
            position: fixed;

            width: 500px;
            height: 500px;

            top: -250px;
            right: -150px;

            background: rgba(212, 175, 55, 0.08);

            filter: blur(100px);
            border-radius: 50%;

            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;

            width: 450px;
            height: 450px;

            bottom: -250px;
            left: -150px;

            background: rgba(212, 175, 55, 0.06);

            filter: blur(100px);
            border-radius: 50%;

            pointer-events: none;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            position: relative;
            z-index: 10;

            width: 100%;
            padding: 28px 7%;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-family: 'Playfair Display', serif;

            font-size: 30px;
            font-weight: 700;

            letter-spacing: 2px;

            color: #f1d36b;
        }

        .logo span {
            color: #ffffff;
        }

        .header-badge {
            padding: 8px 16px;

            border: 1px solid rgba(243, 214, 117, 0.35);
            border-radius: 50px;

            color: #e6d184;

            background: rgba(255, 255, 255, 0.03);

            font-size: 11px;
            letter-spacing: 1.5px;

            backdrop-filter: blur(10px);
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            position: relative;
            z-index: 2;

            max-width: 1250px;
            min-height: calc(100vh - 100px);

            margin: 0 auto;

            padding: 50px 7% 80px;

            display: grid;
            grid-template-columns: 1fr 1fr;

            align-items: center;

            gap: 70px;
        }

        /* =========================
           LEFT CONTENT
        ========================= */

        .content {
            animation: fadeUp 1s ease forwards;
        }

        .eyebrow {
            display: inline-flex;

            align-items: center;
            gap: 10px;

            margin-bottom: 22px;

            color: #d9c47a;

            font-size: 13px;
            font-weight: 600;

            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .eyebrow::before {
            content: "";

            width: 35px;
            height: 1px;

            background: #d9c47a;
        }

        h1 {
            margin-bottom: 25px;

            font-family: 'Playfair Display', serif;

            font-size: clamp(48px, 6vw, 78px);
            font-weight: 600;

            line-height: 1.02;

            letter-spacing: -2px;
        }

        h1 .gold {
            color: #e4c75d;
        }

        .description {
            max-width: 520px;

            margin-bottom: 35px;

            color: #a9a9a9;

            font-size: 17px;
            line-height: 1.8;
        }

        /* =========================
           BUTTON
        ========================= */

        .cta-wrapper {
            display: flex;

            align-items: center;
            gap: 20px;

            flex-wrap: wrap;
        }

        .cta {
            position: relative;

            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 12px;

            padding: 17px 30px;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #f1d66c,
                    #b38d27
                );

            color: #17120a;

            font-size: 15px;
            font-weight: 700;

            letter-spacing: 0.5px;

            text-decoration: none;

            box-shadow:
                0 10px 30px rgba(212, 175, 55, 0.18),
                inset 0 1px 0 rgba(255, 255, 255, 0.4);

            overflow: hidden;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        .cta::before {
            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 100%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255, 255, 255, 0.35),
                    transparent
                );

            transition: left 0.6s ease;
        }

        .cta:hover::before {
            left: 100%;
        }

        .cta:hover {
            transform: translateY(-3px);

            box-shadow:
                0 15px 40px rgba(212, 175, 55, 0.30),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);
        }

        .arrow {
            font-size: 18px;

            transition:
                transform 0.3s ease;
        }

        .cta:hover .arrow {
            transform: translateX(5px);
        }

        .secure-text {
            color: #777;

            font-size: 12px;
        }

        /* =========================
           IMAGE
        ========================= */

        .visual {
            position: relative;

            animation: fadeIn 1.2s ease forwards;
        }

        .image-container {
            position: relative;

            width: 100%;

            aspect-ratio: 4 / 5;

            max-height: 650px;

            overflow: hidden;

            border-radius: 28px;

            border: 1px solid rgba(255, 255, 255, 0.10);

            background: #111;

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.6),
                0 0 60px rgba(212, 175, 55, 0.05);
        }

        .image-container img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;
            object-position: center;

            transition:
                transform 0.8s ease;
        }

        .image-container:hover img {
            transform: scale(1.04);
        }

        /* =========================
           IMAGE OVERLAY
        ========================= */

        .image-overlay {
            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    to top,
                    rgba(0, 0, 0, 0.60) 0%,
                    rgba(0, 0, 0, 0.08) 50%,
                    rgba(0, 0, 0, 0.08) 100%
                );

            pointer-events: none;
        }

        /* =========================
           GOLD BORDER
        ========================= */

        .image-container::before {
            content: "";

            position: absolute;

            inset: 12px;

            border: 1px solid rgba(235, 205, 105, 0.35);

            border-radius: 20px;

            z-index: 2;

            pointer-events: none;
        }

        /* =========================
           FLOATING CARD
        ========================= */

        .floating-card {
            position: absolute;

            left: -35px;
            bottom: 35px;

            z-index: 5;

            min-width: 190px;

            padding: 18px 20px;

            border: 1px solid rgba(255, 255, 255, 0.12);

            border-radius: 16px;

            background: rgba(18, 18, 18, 0.82);

            backdrop-filter: blur(20px);

            box-shadow:
                0 20px 40px rgba(0, 0, 0, 0.35);
        }

        .floating-card small {
            display: block;

            color: #d9c47a;

            font-family: 'Playfair Display', serif;

            font-size: 21px;
            font-weight: 600;

            line-height: 1.3;

            letter-spacing: 0.5px;
        }

        /* =========================
           DECORATIVE LINE
        ========================= */

        .decorative-line {
            position: absolute;

            right: -50px;
            top: 15%;

            width: 100px;
            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #d7bd60
                );
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            position: relative;

            z-index: 2;

            padding: 25px 7%;

            border-top: 1px solid rgba(255, 255, 255, 0.06);

            text-align: center;

            color: #666;

            font-size: 11px;

            letter-spacing: 0.5px;
        }

        /* =========================
           ANIMATION
        ========================= */

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(30px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* =========================
           TABLET
        ========================= */

        @media (max-width: 900px) {

            header {
                padding: 22px 6%;
            }

            .hero {
                grid-template-columns: 1fr;

                gap: 45px;

                padding: 35px 6% 60px;
            }

            .content {
                text-align: center;
            }

            .eyebrow {
                justify-content: center;
            }

            .description {
                margin-left: auto;
                margin-right: auto;
            }

            .cta-wrapper {
                justify-content: center;
            }

            .visual {
                width: 100%;

                max-width: 550px;

                margin: 0 auto;
            }

            .floating-card {
                left: 15px;
            }

            .decorative-line {
                display: none;
            }
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            header {
                padding: 20px 5%;
            }

            .logo {
                font-size: 24px;
            }

            .header-badge {
                padding: 7px 11px;

                font-size: 9px;
            }

            .hero {
                padding: 25px 5% 50px;
            }

            h1 {
                font-size: 46px;

                letter-spacing: -1px;
            }

            .description {
                font-size: 15px;

                line-height: 1.7;
            }

            .cta {
                width: 100%;

                padding: 16px 25px;
            }

            .secure-text {
                width: 100%;

                text-align: center;
            }

            .image-container {
                border-radius: 20px;
            }

            .image-container::before {
                inset: 8px;

                border-radius: 15px;
            }

            .floating-card {
                bottom: 20px;

                left: 10px;

                min-width: 165px;

                padding: 14px 16px;
            }

            .floating-card small {
                font-size: 18px;
            }
        }
    </style>
</head>
